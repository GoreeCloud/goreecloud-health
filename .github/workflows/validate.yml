name: Validate GoreeCloud Health foundation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate repository foundation
        run: node scripts/validate-foundation.mjs
      - name: Validate health record contract
        run: node scripts/validate-health-record-contract.mjs
