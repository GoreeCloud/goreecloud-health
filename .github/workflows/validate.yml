name: Validate GoreeCloud Health foundation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
      - name: Verify source revision
        shell: bash
        run: |
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$expected" ]; then
            echo "Expected source revision $expected but checked out $actual" >&2
            exit 1
          fi
          echo "Validated exact source revision: $actual"
      - name: Verify pinned Glaze UI source revision
        shell: bash
        run: |
          expected="8354308445da9ac35ced2b37a7f503a08a0aaf72"
          actual="$(git -C vendor/glaze-ui rev-parse HEAD)"
          if [ "$actual" != "$expected" ]; then
            echo "Expected Glaze UI source revision $expected but checked out $actual" >&2
            exit 1
          fi
          test "$(cat vendor/glaze-ui/VERSION)" = "1.3.0"
          test -f vendor/glaze-ui/css/glaze-v1.3.0.css
          echo "Validated GLAZE UI V1.3.0 source revision: $actual"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate repository foundation
        run: node scripts/validate-foundation.mjs
      - name: Validate Glaze UI adoption source boundary
        run: node scripts/validate-glaze-ui-adoption.mjs
      - name: Check web application JavaScript syntax
        run: node --check apps/web/app.js
      - name: Validate health record contract
        run: node scripts/validate-health-record-contract.mjs
      - name: Validate Privacy Shield source boundary
        run: node scripts/validate-privacy-boundary.mjs

  platform-contract:
    name: Validate exact GoreeCloud Platform Contract
    uses: GoreeCloud/GoreeCloud/.github/workflows/reusable-platform-manifest.yml@235e519fe342d7e7075c8239fbf0f3a19dc4c6c8
    with:
      manifest-path: goreecloud.platform.yaml