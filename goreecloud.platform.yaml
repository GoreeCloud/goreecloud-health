schema_version: '0.3'
component:
  type: application
  id: goreecloud-health
  product_name: GoreeCloud Health
  repository: GoreeCloud/goreecloud-health
lifecycle: development
version: '0.0.1-foundation'
supported_platforms:
- web
- android
api:
  versions: []
  endpoints: []
platform_systems:
  manager:
    result: applicable-blocked
    version: null
    evidence:
    - SPECIFICATIONS.md
    notes: Operational and administrative integration is planned; no runtime Manager integration is claimed.
  privacy_shield:
    result: applicable-blocked
    version: null
    evidence:
    - privacy/privacy-shield.application-manifest.json
    - scripts/validate-privacy-boundary.mjs
    - docs/PRIVACY.md
    - SECURITY.md
    notes: Source-level application manifest is fail-closed with no declared purposes or resources. Runtime authorization and acceptance remain required before real health-data processing or synchronization; the foundation intentionally processes no real health records.
  wardveil_security:
    result: applicable-blocked
    version: null
    evidence:
    - SECURITY.md
    notes: Required security integration remains planned. No Wardveil protection claim is made.
  everkeep:
    result: applicable-blocked
    version: null
    evidence:
    - SPECIFICATIONS.md
    - FEATURE-ROADMAP.md
    notes: Backup, restore, portability, and recovery acceptance are planned before durable cloud health state is production-dependent.
  glaze_ui:
    result: applicable-migration-required
    version: '1.3.0'
    evidence:
    - docs/GLAZE-UI-ADOPTION.md
    - apps/web/app.css
    notes: Health has repository-local GLAZE UI V1.3 / 1.3.0 foundation work, but current Stable GLAZE UI V1.4.1 / 1.4.1 is now required. Current-Stable migration and application-specific consumer acceptance are not established.
  mesh:
    result: applicable-blocked
    version: null
    evidence:
    - SPECIFICATIONS.md
    notes: Minimized coordination/evidence transport is planned only where justified. No runtime Mesh integration exists.
    capabilities: []
    dependencies: []
    published_events: []
    consumed_events: []
  identity:
    result: applicable-blocked
    version: null
    evidence:
    - SPECIFICATIONS.md
    - SECURITY.md
    notes: Account, authentication, authorization, device, and session integration is planned. The foundation has no sign-in or cloud account flow.
  sync:
    result: applicable-blocked
    version: null
    evidence:
    - SPECIFICATIONS.md
    - FEATURE-ROADMAP.md
    notes: Authorized cross-device health-state synchronization is a planned responsibility, but no accepted GoreeCloud Sync dataset contract, conflict model, offline reconciliation, or runtime acceptance evidence exists.
health:
  health_endpoint: null
  readiness_endpoint: null
continuity:
  backup:
    required: true
    requirements:
    - Define accepted Everkeep protection for any durable server-side health state before production dependence.
  restore:
    required: true
    requirements:
    - Verify restoration, integrity, privacy obligations, and source provenance before recovery-ready claims.
  export:
    required: true
    requirements:
    - Provide user-controlled portable export for supported health records and metadata.
  portability:
    required: true
    requirements:
    - Preserve understandable health record/source semantics in supported export and migration paths.
external_dependencies:
- name: Android Health Connect
  purpose: Planned least-privilege, user-visible Android health-data integration after required privacy and runtime acceptance gates; not enabled or authorized in the current foundation.
  required: false
compatibility:
  platform_contract: '0.3'
  glaze_ui_required: '1.4.1'
  requires:
  - goreecloud-platform-contract==0.3
  - glaze-ui==1.4.1
  provides:
  - goreecloud-health-web-foundation
  - goreecloud-health-android-foundation
evidence:
  acceptance_tests: []
  release: []
conformance:
  status: nonconformant
  validated_at: null
  evidence:
  - README.md
  - FEATURES.md
  - docs/GLAZE-UI-ADOPTION.md
  - docs/PRIVACY.md
  - privacy/privacy-shield.application-manifest.json
  blockers:
  - Real health-data ingestion and operation-level Privacy Shield authorization/runtime acceptance are not implemented.
  - Current Stable GLAZE UI V1.4.1 migration and consumer acceptance are not established.
  - Wardveil Security, Privacy Shield, Everkeep, Identity, Mesh, Sync, and Manager runtime integrations are incomplete.
  - Android reproducible build/physical-device acceptance is incomplete.
  - Production deployment, accessibility acceptance, recovery acceptance, and exact release evidence are incomplete.
