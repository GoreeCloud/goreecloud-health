schema_version: '0.2'
component:
  type: application
  id: goreecloud-health
  product_name: GoreeCloud Health
  repository: GoreeCloud/goreecloud-health
lifecycle: development
version: '0.0.1-foundation'
supported_platforms:
- web
- android
api:
  versions: []
  endpoints: []
platform_systems:
  manager:
    result: applicable-blocked
    version: null
    evidence:
    - SPECIFICATIONS.md
    notes: Operational and administrative integration is planned; no runtime Manager integration is claimed.
  privacy_shield:
    result: applicable-blocked
    version: null
    evidence:
    - docs/PRIVACY.md
    - SECURITY.md
    notes: Required before real health-data processing or synchronization. The foundation intentionally processes no real health records.
  wardveil_security:
    result: applicable-blocked
    version: null
    evidence:
    - SECURITY.md
    notes: Required security integration remains planned. No Wardveil protection claim is made.
  everkeep:
    result: applicable-blocked
    version: null
    evidence:
    - SPECIFICATIONS.md
    - FEATURE-ROADMAP.md
    notes: Backup, restore, portability, and recovery acceptance are planned before durable cloud health state is production-dependent.
  glaze_ui:
    result: applicable-migration-required
    version: 1.3.0
    evidence:
    - docs/GLAZE-UI-ADOPTION.md
    - apps/web/app.css
    notes: GLAZE UI V1.3 1.3.0 is the current Stable target. Foundation styling follows core direction but repository-local consumer acceptance is not yet established.
  mesh:
    result: applicable-blocked
    version: null
    evidence:
    - SPECIFICATIONS.md
    notes: Minimized coordination/evidence transport is planned only where justified. No runtime Mesh integration exists.
    capabilities: []
    dependencies: []
    published_events: []
    consumed_events: []
  identity:
    result: applicable-blocked
    version: null
    evidence:
    - SPECIFICATIONS.md
    - SECURITY.md
    notes: Account, authentication, authorization, device, and session integration is planned. The foundation has no sign-in or cloud account flow.
health:
  health_endpoint: null
  readiness_endpoint: null
continuity:
  backup:
    required: true
    requirements:
    - Define accepted Everkeep protection for any durable server-side health state before production dependence.
  restore:
    required: true
    requirements:
    - Verify restoration, integrity, privacy obligations, and source provenance before recovery-ready claims.
  export:
    required: true
    requirements:
    - Provide user-controlled portable export for supported health records and metadata.
  portability:
    required: true
    requirements:
    - Preserve understandable health record/source semantics in supported export and migration paths.
external_dependencies:
- name: Android Health Connect
  required: false
  status: planned
compatibility:
  platform_contract: '0.2'
  glaze_ui_required: 1.3.0
  requires:
  - goreecloud-platform-contract==0.2
  - glaze-ui==1.3.0
  provides:
  - goreecloud-health-web-foundation
  - goreecloud-health-android-foundation
evidence:
  acceptance_tests: []
  release: []
conformance:
  status: nonconformant
  validated_at: null
  evidence:
  - README.md
  - FEATURES.md
  - docs/GLAZE-UI-ADOPTION.md
  blockers:
  - Real health-data ingestion and privacy authorization are not implemented.
  - Current GLAZE UI V1.3 consumer acceptance is not established.
  - Wardveil Security, Privacy Shield, Everkeep, Identity, Mesh, and Manager runtime integrations are incomplete.
  - Android reproducible build/physical-device acceptance is incomplete.
  - Production deployment, accessibility acceptance, recovery acceptance, and exact release evidence are incomplete.
